name: 'extport safari-build'
description: 'Build, sign, and upload a Safari extension to App Store Connect (requires a macOS runner)'
author: 'extport'

inputs:
  project-path:
    description: 'Directory containing the .xcodeproj. Omit to fall back to the checked-out repo''s extport.config.json.'
    required: false
  team-id:
    description: 'Apple Developer Team ID. Omit to fall back to the checked-out repo''s extport.config.json.'
    required: false
  issuer-id:
    description: 'App Store Connect API issuer id.'
    required: false
  key-id:
    description: 'App Store Connect API key id.'
    required: false
  key-base64:
    description: 'Base64-encoded contents of the App Store Connect .p8 API key. Pass a repository secret — never commit the raw file.'
    required: false
  platform:
    description: 'Build only "macos" or only "ios". Omit to build every platform the Xcode project ships.'
    required: false
  version:
    description: "Fail loudly if the built app's version doesn't match this."
    required: false
  macos-deployment-target:
    description: 'Minimum macOS version to build for.'
    required: false
    default: '12.0'
  cli-version:
    description: 'Pinned @extport/cli version to install and run.'
    required: false
    default: '0.0.3'
  working-directory:
    description: 'Directory to run in — set this in a monorepo where the WXT project (and its extport.config.json) isn''t at the repo root. GitHub Actions'' own working-directory step property has no effect on a `uses:` step like this one, which is why this exists as its own input.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Write the .p8 key to a temp file
      if: inputs.key-base64 != ''
      shell: bash
      env:
        EXTPORT_KEY_BASE64: ${{ inputs.key-base64 }}
      run: |
        set -euo pipefail
        key_path="$RUNNER_TEMP/extport-asc-key.p8"
        echo "$EXTPORT_KEY_BASE64" | base64 --decode > "$key_path"
        chmod 600 "$key_path"
        echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

    - name: extport safari-build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTPORT_PROJECT_PATH: ${{ inputs.project-path }}
        EXTPORT_TEAM_ID: ${{ inputs.team-id }}
        EXTPORT_ISSUER_ID: ${{ inputs.issuer-id }}
        EXTPORT_KEY_ID: ${{ inputs.key-id }}
        EXTPORT_PLATFORM: ${{ inputs.platform }}
        EXTPORT_VERSION: ${{ inputs.version }}
        EXTPORT_MACOS_DEPLOYMENT_TARGET: ${{ inputs.macos-deployment-target }}
        EXTPORT_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        # npx --yes <pkg>@<version> <args> occasionally swallows a failed
        # fetch/install silently instead of erroring, then falls through to
        # "run" anyway and fails with a bare "command not found" — no visible
        # npm error. Installing explicitly surfaces a real failure if the
        # package genuinely can't be fetched, instead of a confusing one.
        npm install --global "@extport/cli@${EXTPORT_CLI_VERSION}"
        # issuer-id/key-id are passed as flags, not ASC_ISSUER_ID/ASC_KEY_ID env
        # vars — a left-empty input would still set those to '' (GitHub
        # Actions' default for an unset optional input), which short-circuits
        # extport safari-build's own `env.ASC_ISSUER_ID ?? extport.config.json`
        # fallback (?? only skips null/undefined, not ''). Omitting the flag
        # entirely lets the CLI fall through to the committed config — and
        # still fail loudly if neither source has it. project-path/team-id
        # have no env var equivalent to worry about, but get the same
        # omit-when-empty treatment so they fall back the same way.
        args=(safari-build --macos-deployment-target "$EXTPORT_MACOS_DEPLOYMENT_TARGET")
        [ -n "$EXTPORT_PROJECT_PATH" ] && args+=(--project-path "$EXTPORT_PROJECT_PATH")
        [ -n "$EXTPORT_TEAM_ID" ] && args+=(--team-id "$EXTPORT_TEAM_ID")
        [ -n "$EXTPORT_ISSUER_ID" ] && args+=(--issuer-id "$EXTPORT_ISSUER_ID")
        [ -n "$EXTPORT_KEY_ID" ] && args+=(--key-id "$EXTPORT_KEY_ID")
        [ -n "$EXTPORT_PLATFORM" ] && args+=(--platform "$EXTPORT_PLATFORM")
        [ -n "$EXTPORT_VERSION" ] && args+=(--version "$EXTPORT_VERSION")
        extport "${args[@]}"

    - name: Clean up the temp key file
      if: always() && inputs.key-base64 != ''
      shell: bash
      run: rm -f "$RUNNER_TEMP/extport-asc-key.p8"
