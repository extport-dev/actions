name: 'extport safari-build'
description: 'Build, sign, and upload a Safari extension to App Store Connect (requires a macOS runner)'
author: 'extport'

inputs:
  project-path:
    description: 'Directory containing the .xcodeproj. Omit to fall back to the checked-out repo''s extport.config.json.'
    required: false
  team-id:
    description: 'Apple Developer Team ID. Omit to fall back to the checked-out repo''s extport.config.json.'
    required: false
  issuer-id:
    description: 'App Store Connect API issuer id.'
    required: false
  key-id:
    description: 'App Store Connect API key id.'
    required: false
  key-base64:
    description: 'Base64-encoded contents of the App Store Connect .p8 API key. Pass a repository secret — never commit the raw file.'
    required: false
  certificate-base64:
    description: 'Base64-encoded contents of a signing certificate .p12 file. Required — see "Signing certificate" below for why. Pass a repository secret.'
    required: true
  certificate-password:
    description: 'Password the .p12 in certificate-base64 was exported with. Required.'
    required: true
  platform:
    description: 'Build only "macos" or only "ios". Omit to build every platform the Xcode project ships.'
    required: false
  version:
    description: "Fail loudly if the built app's version doesn't match this."
    required: false
  macos-deployment-target:
    description: 'Minimum macOS version to build for.'
    required: false
    default: '12.0'
  debug:
    description: 'Stream xcodebuild''s full raw output live instead of only dumping it on failure. Off by default because it''s verbose — turn on when a run looks stuck and you need to see what xcodebuild is actually doing.'
    required: false
    default: 'false'
  cli-version:
    description: 'Pinned @extport/cli version to install and run.'
    required: false
    default: '0.0.4'
  working-directory:
    description: 'Directory to run in — set this in a monorepo where the WXT project (and its extport.config.json) isn''t at the repo root. GitHub Actions'' own working-directory step property has no effect on a `uses:` step like this one, which is why this exists as its own input.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    # `required: true` above is a documentation hint only — composite actions
    # don't get automatic required-input enforcement from the runner (a
    # long-standing GitHub Actions gap), so it does NOT actually fail the job
    # if these are omitted. This step is the real enforcement, on purpose:
    # see "Import the signing certificate" below for why silently proceeding
    # without one is exactly the failure mode this whole thing exists to
    # prevent.
    - name: Require a signing certificate
      shell: bash
      env:
        EXTPORT_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        EXTPORT_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail
        if [ -z "$EXTPORT_CERTIFICATE_BASE64" ] || [ -z "$EXTPORT_CERTIFICATE_PASSWORD" ]; then
          echo "::error::certificate-base64 and certificate-password are both required — see https://github.com/extport-dev/actions#signing-certificate for how to generate one. Omitting them used to silently fall back to minting a new Apple certificate every run, which permanently burns one each time and eventually hits Apple's account-wide cap; that fallback no longer exists." >&2
          exit 1
        fi

    - name: Write the .p8 key to a temp file
      if: inputs.key-base64 != ''
      shell: bash
      env:
        EXTPORT_KEY_BASE64: ${{ inputs.key-base64 }}
      run: |
        set -euo pipefail
        key_path="$RUNNER_TEMP/extport-asc-key.p8"
        echo "$EXTPORT_KEY_BASE64" | base64 --decode > "$key_path"
        chmod 600 "$key_path"
        echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

    # A GitHub-hosted macOS runner starts with an empty keychain every run.
    # Cloud signing (CODE_SIGN_STYLE=Automatic + -allowProvisioningUpdates,
    # what `extport safari-build` uses) resolves a signing identity from the
    # *local keychain*, not from the certificates already sitting in your
    # Apple account — if it can't find one locally it asks Apple to mint a
    # brand new one. On an ephemeral runner that new certificate's private
    # key is destroyed with the runner at the end of the job, so it's
    # permanently unusable garbage from that point on: every run without this
    # step burns one certificate for good. Apple caps how many of a given
    # type an account may have, so this eventually fails outright with
    # "Your account has reached the maximum number of certificates" —
    # confirmed against a real account that had silently hit the cap this
    # way. Importing one certificate you generated and saved yourself, and
    # reusing it every run, avoids minting new ones at all.
    - name: Import the signing certificate into a temporary keychain
      shell: bash
      env:
        EXTPORT_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        EXTPORT_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail
        cert_path="$RUNNER_TEMP/extport-cert.p12"
        keychain_path="$RUNNER_TEMP/extport-signing.keychain-db"
        keychain_password="$(uuidgen)"
        echo "$EXTPORT_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"

        security create-keychain -p "$keychain_password" "$keychain_path"
        security set-keychain-settings "$keychain_path"
        security unlock-keychain -p "$keychain_password" "$keychain_path"

        # Prepend rather than replace — keep whatever's already on the
        # default search list resolvable too. `readarray`/`mapfile` isn't an
        # option: macOS's /bin/bash is stuck on 3.2 (last GPLv2 release,
        # Apple never shipped 4.0+), which predates both — confirmed the hard
        # way, this exact line failed with "readarray: command not found" on
        # a real runner.
        existing_keychains=()
        while IFS= read -r line; do
          existing_keychains+=("$line")
        done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
        security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"

        # /usr/bin/productbuild must be trusted too, not just codesign/security:
        # exporting a macOS (not iOS) app for the App Store makes xcodebuild
        # shell out to productbuild internally to sign the installer package.
        # Without it in the trusted-app list, productbuild silently blocks on
        # a keychain-access confirmation dialog that can never appear on a
        # headless runner — no error, no timeout, just a permanent hang.
        # Confirmed the hard way: a real run sat at "exporting and uploading"
        # for 25+ minutes with zero output, and cancelling it showed
        # productbuild as the orphaned process still running.
        security import "$cert_path" -k "$keychain_path" -P "$EXTPORT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
        security default-keychain -s "$keychain_path"

        rm -f "$cert_path"
        echo "EXTPORT_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

    - name: extport safari-build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTPORT_PROJECT_PATH: ${{ inputs.project-path }}
        EXTPORT_TEAM_ID: ${{ inputs.team-id }}
        EXTPORT_ISSUER_ID: ${{ inputs.issuer-id }}
        EXTPORT_KEY_ID: ${{ inputs.key-id }}
        EXTPORT_PLATFORM: ${{ inputs.platform }}
        EXTPORT_VERSION: ${{ inputs.version }}
        EXTPORT_MACOS_DEPLOYMENT_TARGET: ${{ inputs.macos-deployment-target }}
        EXTPORT_DEBUG: ${{ inputs.debug }}
        EXTPORT_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        # npx --yes <pkg>@<version> <args> occasionally swallows a failed
        # fetch/install silently instead of erroring, then falls through to
        # "run" anyway and fails with a bare "command not found" — no visible
        # npm error. Installing explicitly surfaces a real failure if the
        # package genuinely can't be fetched, instead of a confusing one.
        npm install --global "@extport/cli@${EXTPORT_CLI_VERSION}"
        # issuer-id/key-id are passed as flags, not ASC_ISSUER_ID/ASC_KEY_ID env
        # vars — a left-empty input would still set those to '' (GitHub
        # Actions' default for an unset optional input), which short-circuits
        # extport safari-build's own `env.ASC_ISSUER_ID ?? extport.config.json`
        # fallback (?? only skips null/undefined, not ''). Omitting the flag
        # entirely lets the CLI fall through to the committed config — and
        # still fail loudly if neither source has it. project-path/team-id
        # have no env var equivalent to worry about, but get the same
        # omit-when-empty treatment so they fall back the same way.
        args=(safari-build --macos-deployment-target "$EXTPORT_MACOS_DEPLOYMENT_TARGET")
        [ -n "$EXTPORT_PROJECT_PATH" ] && args+=(--project-path "$EXTPORT_PROJECT_PATH")
        [ -n "$EXTPORT_TEAM_ID" ] && args+=(--team-id "$EXTPORT_TEAM_ID")
        [ -n "$EXTPORT_ISSUER_ID" ] && args+=(--issuer-id "$EXTPORT_ISSUER_ID")
        [ -n "$EXTPORT_KEY_ID" ] && args+=(--key-id "$EXTPORT_KEY_ID")
        [ -n "$EXTPORT_PLATFORM" ] && args+=(--platform "$EXTPORT_PLATFORM")
        [ -n "$EXTPORT_VERSION" ] && args+=(--version "$EXTPORT_VERSION")
        [ "$EXTPORT_DEBUG" = "true" ] && args+=(--debug)

        # Tee into a file so the run stays live in the log (same as today)
        # while also letting us pull out just the CLI's own progress/result
        # lines afterward — `── platform: step ──` and `✅`/`❌` are the
        # only lines extport itself prints (see safari-build.ts's log()
        # calls); everything else on stdout is raw xcodebuild noise, which
        # this deliberately leaves out of the summary. `|| status=$?` (not a
        # bare `set -e` failure) is what lets the summary still get written
        # on a failed build instead of the script exiting before reaching it.
        output_file="$RUNNER_TEMP/extport-safari-build-output.log"
        status=0
        extport "${args[@]}" 2>&1 | tee "$output_file" || status=$?

        {
          echo '### Safari build'
          echo
          if grep -qE '^(✅|❌|──)' "$output_file"; then
            grep -E '^(✅|❌|──)' "$output_file" | sed 's/^/- /'
          else
            echo '_No progress markers captured — see the full step log._'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$status"

    - name: Clean up the temp key file
      if: always() && inputs.key-base64 != ''
      shell: bash
      run: rm -f "$RUNNER_TEMP/extport-asc-key.p8"

    - name: Delete the temporary signing keychain
      if: always()
      shell: bash
      run: |
        keychain_path="$RUNNER_TEMP/extport-signing.keychain-db"
        [ -f "$keychain_path" ] && security delete-keychain "$keychain_path" || true
