name: 'extport push'
description: 'Upload a browser extension artifact to extport'
author: 'extport'

inputs:
  file:
    description: 'Path to the zip file to upload. In a WXT project, omit to infer .output/{name}-{version}-{store}.zip from package.json (always omit when store is safari — the binary already reached App Store Connect via extport-dev/actions/safari-build).'
    required: false
  extension:
    description: 'Target extension id or slug. Omit if the checked-out repo has an extport.config.json with "extension" set.'
    required: false
  version:
    description: "Artifact version, 1-4 dot-separated integers (e.g. 1.2.3). Omit to infer it from the zip's manifest.json, or from package.json when store is safari."
    required: false
  store:
    description: 'chrome, firefox, edge, or safari. With file set, omit to push one universal zip to every configured store. With both file and store omitted, pushes every enabled store individually, each inferred from the WXT project.'
    required: false
  source-zip:
    description: 'Source code zip for Firefox AMO review. Only valid when store is firefox.'
    required: false
  api-key:
    description: 'extport API key. Pass a repository secret, e.g. secrets.EXTPORT_API_KEY — never inline the raw value.'
    required: true
  api-url:
    description: 'extport platform URL.'
    required: false
    default: 'https://dash.extport.dev'
  cli-version:
    description: 'Pinned @extport/cli version to install and run.'
    required: false
    default: '0.0.4'
  working-directory:
    description: 'Directory to run in — set this in a monorepo where the WXT project (and its extport.config.json) isn''t at the repo root. GitHub Actions'' own working-directory step property has no effect on a `uses:` step like this one, which is why this exists as its own input.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: extport push
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTPORT_API_KEY: ${{ inputs.api-key }}
        EXTPORT_API_URL: ${{ inputs.api-url }}
        EXTPORT_FILE: ${{ inputs.file }}
        EXTPORT_EXTENSION: ${{ inputs.extension }}
        EXTPORT_VERSION: ${{ inputs.version }}
        EXTPORT_STORE: ${{ inputs.store }}
        EXTPORT_SOURCE_ZIP: ${{ inputs.source-zip }}
        EXTPORT_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        # npx --yes <pkg>@<version> <args> occasionally swallows a failed
        # fetch/install silently instead of erroring, then falls through to
        # "run" anyway and fails with a bare "command not found" — no visible
        # npm error. Installing explicitly surfaces a real failure if the
        # package genuinely can't be fetched, instead of a confusing one.
        npm install --global "@extport/cli@${EXTPORT_CLI_VERSION}"
        args=(push)
        [ -n "$EXTPORT_FILE" ] && args+=("$EXTPORT_FILE")
        [ -n "$EXTPORT_EXTENSION" ] && args+=(--extension "$EXTPORT_EXTENSION")
        [ -n "$EXTPORT_VERSION" ] && args+=(--version "$EXTPORT_VERSION")
        [ -n "$EXTPORT_STORE" ] && args+=(--store "$EXTPORT_STORE")
        [ -n "$EXTPORT_SOURCE_ZIP" ] && args+=(--source-zip "$EXTPORT_SOURCE_ZIP")
        extport "${args[@]}"
